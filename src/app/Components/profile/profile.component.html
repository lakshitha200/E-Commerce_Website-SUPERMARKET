<section class="page mycontainer">
  <div class="card-soft profile">
    <div class="avatar"><img src="assets/profile.png" [alt]="user.name" (error)="$any($event.target).style.display='none'"><i class="fa-regular fa-user"></i></div>
    <div class="who">
      <h1>{{user.name}}</h1>
      <span>&#64;{{user.username}}</span>
    </div>
    <button type="button" class="btn-ghost" (click)="logout()"><i class="fa-solid fa-arrow-right-from-bracket"></i> Sign out</button>
  </div>

  <div class="grid">
    <div class="card-soft cell"><i class="fa-regular fa-envelope"></i><div><small>Email</small><b>{{user.email}}</b></div></div>
    <div class="card-soft cell"><i class="fa-solid fa-phone"></i><div><small>Phone</small><b>{{user.phone}}</b></div></div>
    <div class="card-soft cell"><i class="fa-solid fa-location-dot"></i><div><small>Address</small><b>{{user.location}}</b></div></div>
    <div class="card-soft cell"><i class="fa-solid fa-earth-asia"></i><div><small>Country</small><b>{{user.country}}</b></div></div>
  </div>

  <div class="shortcuts">
    <a routerLink="/myShopping-cart" class="btn-fresh"><i class="fa-solid fa-basket-shopping"></i> My cart</a>
    <a routerLink="/all-products" class="btn-ghost">Continue shopping</a>
  </div>
</section>
