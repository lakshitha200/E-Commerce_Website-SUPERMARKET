<section class="page mycontainer">
  <nav class="crumbs" aria-label="Breadcrumb">
    <a routerLink="/">Home</a> <i class="fa-solid fa-chevron-right"></i>
    <a routerLink="/all-products">Products</a>
    <ng-container *ngIf="category || query"> <i class="fa-solid fa-chevron-right"></i> <span>{{title}}</span></ng-container>
  </nav>

  <div class="head">
    <div>
      <h1 class="page-title">{{title}}</h1>
      <p class="page-sub">{{products.length}} {{products.length === 1 ? 'item' : 'items'}} found</p>
    </div>
    <label class="sort">
      <span>Sort by</span>
      <select (change)="setSort($any($event.target).value)" aria-label="Sort products">
        <option value="default">Featured</option>
        <option value="low">Price: low to high</option>
        <option value="high">Price: high to low</option>
        <option value="name">Name: A to Z</option>
      </select>
    </label>
  </div>

  <div class="product-grid" *ngIf="products.length; else none">
    <app-product-card *ngFor="let p of products" [product]="p"></app-product-card>
  </div>

  <ng-template #none>
    <div class="card-soft empty">
      <i class="fa-solid fa-magnifying-glass"></i>
      <h2>No products found</h2>
      <p>Try a different search or browse a category.</p>
      <a routerLink="/all-products" class="btn-fresh">View all products</a>
    </div>
  </ng-template>
</section>
