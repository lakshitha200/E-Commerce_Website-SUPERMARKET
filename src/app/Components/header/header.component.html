<div class="topbar">
  <div class="mycontainer topbar-in">
    <span><i class="fa-solid fa-location-dot"></i> Delivering from <b>Moratuwa</b></span>
    <span class="dot">•</span>
    <span class="promo"><i class="fa-solid fa-truck-fast"></i> Free delivery over Rs. 5,000</span>
    <span class="spacer"></span>
    <a routerLink="/contact"><i class="fa-regular fa-comments"></i> Help</a>
  </div>
</div>

<header class="site-header">
  <div class="mycontainer bar">
    <a routerLink="/" class="brand" aria-label="Freshora home">
      <img src="assets/logo-mark.svg" alt="" width="40" height="40">
      <span class="brand-name">Fresh<span>ora</span></span>
    </a>

    <div class="search-slot"><app-search></app-search></div>

    <nav class="links" [class.open]="menuOpen" aria-label="Main">
      <a routerLink="/" [routerLinkActiveOptions]="{exact:true}" routerLinkActive="active" (click)="menuOpen=false">Home</a>
      <a routerLink="/all-products" routerLinkActive="active" (click)="menuOpen=false">All Products</a>
      <a routerLink="/bill-payment" routerLinkActive="active" (click)="menuOpen=false">Bill Payment</a>
      <a routerLink="/contact" routerLinkActive="active" (click)="menuOpen=false">Contact</a>
    </nav>

    <div class="actions">
      <a routerLink="/notifications" class="icon-btn" aria-label="Notifications"><i class="fa-regular fa-bell"></i></a>
      <a routerLink="/myShopping-cart" class="icon-btn" aria-label="Cart">
        <i class="fa-solid fa-basket-shopping"></i>
        <span class="count" *ngIf="(cart.count$ | async) as n">{{n}}</span>
      </a>

      <div class="dropdown">
        <button class="icon-btn" type="button" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Account">
          <i class="fa-regular fa-user"></i>
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
          <ng-container *ngIf="auth.isLogged$ | async; else guest">
            <li><a class="dropdown-item" routerLink="/profile"><i class="fa-regular fa-id-card me-2"></i>My profile</a></li>
            <li><button class="dropdown-item" type="button" (click)="logout()"><i class="fa-solid fa-arrow-right-from-bracket me-2"></i>Sign out</button></li>
          </ng-container>
          <ng-template #guest>
            <li><a class="dropdown-item" routerLink="/sign-in"><i class="fa-solid fa-arrow-right-to-bracket me-2"></i>Sign in</a></li>
            <li><a class="dropdown-item" routerLink="/sign-up"><i class="fa-solid fa-user-plus me-2"></i>Create account</a></li>
          </ng-template>
        </ul>
      </div>

      <button class="icon-btn burger" type="button" (click)="menuOpen = !menuOpen" [attr.aria-expanded]="menuOpen" aria-label="Toggle menu">
        <i class="fa-solid" [ngClass]="menuOpen ? 'fa-xmark' : 'fa-bars'"></i>
      </button>
    </div>
  </div>
  <div class="mycontainer mobile-search"><app-search></app-search></div>
  <app-categorites></app-categorites>
</header>
