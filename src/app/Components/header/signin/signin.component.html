<section class="page mycontainer">
  <div class="card-soft center-card">
    <h1>Welcome back</h1>
    <p class="lead">Sign in to your Freshora account.</p>
    <div class="notice" *ngIf="returnUrl"><i class="fa-solid fa-lock"></i> Please sign in to continue.</div>

    <form (submit)="submit($event, u.value, p.value)">
      <div class="form-field">
        <label for="username">Username</label>
        <input #u id="username" type="text" name="username" autocomplete="username" required placeholder="vipuser">
      </div>
      <div class="form-field">
        <label for="password">Password</label>
        <div class="pw">
          <input #p id="password" [type]="showPassword ? 'text' : 'password'" name="password" autocomplete="current-password" required placeholder="Your password">
          <button type="button" class="eye" (click)="showPassword = !showPassword" [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
            <i class="fa-regular" [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
          </button>
        </div>
        <div class="error" *ngIf="error" role="alert">{{error}}</div>
      </div>

      <div class="row-between">
        <label class="check"><input type="checkbox"> Remember me</label>
        <a href="#" class="link">Forgot password?</a>
      </div>

      <button type="submit" class="btn-fresh btn-block" [disabled]="busy">{{busy ? 'Signing in...' : 'Sign in'}}</button>
      <p class="demo"><i class="fa-solid fa-circle-info"></i> Demo account: <b>vipuser</b> / <b>vip123</b></p>
      <p class="alt">Not a member? <a routerLink="/sign-up" [queryParams]="returnUrl ? {returnUrl: returnUrl} : null">Create an account</a></p>
    </form>
  </div>
</section>
