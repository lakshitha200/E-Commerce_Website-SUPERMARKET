<nav class="cat-bar" aria-label="Product categories">
  <div class="mycontainer cat-scroll">
    <a routerLink="/all-products" [routerLinkActiveOptions]="{exact:true}" routerLinkActive="active" class="chip">
      <i class="fa-solid fa-border-all"></i> All
    </a>
    <a *ngFor="let c of productService.categories" [routerLink]="['/all-products', c.key]" routerLinkActive="active" class="chip">
      <i class="fa-solid" [ngClass]="c.icon"></i> {{c.label}}
    </a>
  </div>
</nav>
