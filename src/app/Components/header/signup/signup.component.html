<section class="page mycontainer">
  <div class="card-soft center-card wide">
    <h1>Create your account</h1>
    <p class="lead">Join Freshora for faster checkout and exclusive offers.</p>

    <form #f (submit)="submit($event, f)">
      <div class="grid2">
        <div class="form-field"><label for="name">Full name</label><input id="name" type="text" name="name" autocomplete="name" required></div>
        <div class="form-field"><label for="username">Username</label><input id="username" type="text" name="username" autocomplete="username" required></div>
        <div class="form-field"><label for="email">Email</label><input id="email" type="email" name="email" autocomplete="email" required></div>
        <div class="form-field"><label for="phone">Phone number</label><input id="phone" type="tel" name="phone" autocomplete="tel" required></div>
        <div class="form-field"><label for="password">Password</label><input id="password" type="password" name="password" autocomplete="new-password" required></div>
        <div class="form-field"><label for="confirm">Confirm password</label><input id="confirm" type="password" name="confirm" autocomplete="new-password" required></div>
      </div>
      <div class="form-field"><label for="location">Delivery address</label><input id="location" type="text" name="location" autocomplete="street-address" required></div>

      <div class="error" *ngIf="error" role="alert">{{error}}</div>

      <button type="submit" class="btn-fresh btn-block" [disabled]="busy">{{busy ? 'Creating account...' : 'Create account'}}</button>
      <p class="alt">Already a member? <a routerLink="/sign-in" [queryParams]="returnUrl ? {returnUrl: returnUrl} : null">Sign in</a></p>
    </form>
  </div>
</section>
