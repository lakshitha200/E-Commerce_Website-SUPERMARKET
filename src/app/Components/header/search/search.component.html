<form class="search" role="search" (submit)="submit($event, box.value)">
  <i class="fa-solid fa-magnifying-glass lead-icon" aria-hidden="true"></i>
  <input #box type="search" placeholder="Search fresh products..." aria-label="Search products" autocomplete="off">
  <button type="submit" class="go">Search</button>
</form>
